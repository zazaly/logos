[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name        = "bulk-rename-utility"
version     = "3.0.0"
description = "A comprehensive desktop bulk-rename tool built with PySide6"
readme      = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "lxml>=5.0.0",
    "pdfplumber>=0.10.0",
    "rarfile>=4.2",
    "py7zr>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
bru = "bru.__main__:main"

[project.gui-scripts]
bulk-rename = "bru.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bru*"]

# ── pytest ────────────────────────────────────────────────────────────────── #
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
pythonpath   = ["."]

# ── ruff (linter / formatter) ─────────────────────────────────────────────── #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # line length handled by formatter

# ── mypy ──────────────────────────────────────────────────────────────────── #
[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true
